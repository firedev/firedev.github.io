<style>
/* Tokens: swap this block to change the visual world. */
:root{
  --font:-apple-system,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --bg:#0e0f11; --surface:#17181b; --raise:#202226; --line:#2b2d32;
  --text:#ececed; --muted:#8f939a; --faint:#5b5f66;
  --accent:#9fc2cf; --on-accent:#0b1317;
  --ok:#8fcf9e; --bad:#e0897f; --warn:#e3c07a;
  --ball:#b9bcc2;
  --r:14px; --r-lg:20px; --gap:16px; --tap:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 var(--font);font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:430px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:calc(env(safe-area-inset-top) + 6px) var(--gap) 0}
.brand{font-size:13px;letter-spacing:.14em;color:var(--muted)}
.back{background:none;border:0;color:var(--muted);padding:10px 8px 10px 0;font-size:15px;min-height:44px}
.ttl{font-size:15px;color:var(--muted)}
.body>*{flex-shrink:0}
.body{flex:1;overflow-y:auto;padding:8px var(--gap) var(--gap);display:flex;flex-direction:column;gap:var(--gap)}
.foot{padding:12px var(--gap) calc(env(safe-area-inset-bottom) + 16px);display:flex;flex-direction:column;gap:10px;background:linear-gradient(transparent,var(--bg) 24%)}
h1{font-size:26px;line-height:1.15;margin:0;font-weight:650}
h2{font-size:13px;margin:0;font-weight:500;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:14px}.faint{color:var(--faint)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--gap);display:flex;flex-direction:column;gap:8px}
.btn{min-height:var(--tap);border-radius:var(--r);border:1px solid var(--line);background:var(--raise);padding:0 20px;font-size:17px;font-weight:550;width:100%}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;min-height:64px;font-size:19px}
.btn.quiet{background:none;border-color:transparent;color:var(--muted);min-height:44px;font-size:15px;font-weight:450}
.btn[disabled]{opacity:.4}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--muted);font-size:15px}
.chip.on{background:var(--raise);color:var(--text);border-color:var(--accent)}
/* path */
.path{display:flex;gap:4px}.path i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.path i.done{background:var(--accent)}.path i.now{background:var(--text)}
/* plan */
.plan{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.plan .item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 16px;min-height:64px;border-top:1px solid var(--line)}
.plan .item:first-child{border-top:0}
.plan .name{font-size:16px;line-height:1.25}
.step{display:flex;align-items:center}
.step button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--raise);font-size:22px;line-height:1}
.step b{min-width:52px;text-align:center;font-weight:550}
/* switch */
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:0 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:100%;text-align:left}
.sw s{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;text-decoration:none}
.sw s::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted)}
.sw.on s{background:var(--accent)}.sw.on s::after{left:21px;background:var(--on-accent)}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.links a{display:flex;align-items:center;min-height:52px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r);color:var(--text);text-decoration:none;font-size:15px}
.links a.lock{color:var(--faint)}
/* banner */
.warn{border:1px solid var(--warn);border-radius:var(--r);padding:12px 14px;color:var(--warn);font-size:14px;line-height:1.35}
/* big timer */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.huge{font-size:92px;font-weight:300;letter-spacing:-.02em;line-height:1}
.huge.dim{color:var(--faint)}
.rate{display:flex;flex-direction:column;gap:12px}
.rate.thirds{position:fixed;left:0;right:0;bottom:0;top:64px;gap:0;padding:0 16px 16px}
.rate.thirds .btn{flex:1;min-height:0;border-radius:0;border-width:0 0 1px}
.rate .btn{min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:22px}
.rate .btn small{font-size:13px;font-weight:400;color:var(--muted)}
/* pacer */
.pacer{position:relative;width:280px;height:280px}
.pacer .circ{position:absolute;inset:0;border-radius:50%;background:var(--raise);border:2px solid var(--accent);transform:scale(.4)}
.lab{text-align:center;display:flex;align-items:baseline;gap:14px;justify-content:center}
.lab b{font-size:30px;font-weight:550}
.lab span{font-size:44px;font-weight:300}
/* mot */
canvas{width:100%;aspect-ratio:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);touch-action:none;display:block}
.status{height:26px;font-size:18px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* schulte */
.grid{display:grid;gap:6px}
.grid button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:24px;font-weight:500;padding:0}
.grid.n7{gap:4px}.grid.n7 button{font-size:18px;border-radius:8px}
.grid button.hit{color:var(--faint);background:none}
.grid button.bad{background:var(--bad);color:#000}
.grid button.mid{border-color:var(--accent)}
/* silence */
.dark{background:#000}.dark .foot{background:none}
.ping{font-size:26px;font-weight:550;min-height:70px;color:var(--text)}
/* text field */
input[type=text]{width:100%;min-height:56px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);padding:0 16px;font-size:17px;outline:0}
input[type=text]:focus{border-color:var(--accent)}
.check{display:flex;align-items:center;gap:14px;min-height:56px;padding:0 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);font-size:16px;width:100%;text-align:left}
.check i{width:26px;height:26px;border-radius:8px;border:2px solid var(--faint);flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:16px;color:var(--on-accent)}
.check.on i{background:var(--accent);border-color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.seg button{min-height:44px;border:0;border-radius:11px;background:none;color:var(--muted);font-size:15px}
.seg button.on{background:var(--raise);color:var(--text)}
.links a.wide{grid-column:1/-1}
.cue{min-height:30px;font-size:22px;font-weight:550;color:var(--accent)}
.lock-ico{font-size:13px;letter-spacing:.1em;color:var(--warn)}
/* games */
.plan a.item{color:var(--text);text-decoration:none}
.plan .item small{color:var(--muted);font-size:14px;white-space:nowrap}
.rate .btn b{font-size:30px;font-weight:300;line-height:1}
input[type=range]{width:100%;height:44px;margin:0;accent-color:var(--accent)}
</style>

<script>
'use strict';
/* ============ pure logic ============ */
const HOLD_MIN = 20, HOLD_DELTA = {easy: 10, ok: 0, hard: -10};
const fmt = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const nextHold = (cur, r) => Math.max(HOLD_MIN, cur + HOLD_DELTA[r]);
const holdStop = ratings => ratings.length >= 2 && ratings.slice(-2).every(r => r === 'hard');
const NUM = ['', 'одна', 'две', 'три', 'четыре', 'пять', 'шесть', 'семь', 'восемь', 'девять', 'десять'];
function cueText(sec) { // sec: multiple of 30
  const m = Math.floor(sec / 60), half = sec % 60 === 30;
  if (!m) return 'полминуты';
  if (half) return m === 1 ? 'полторы минуты' : (NUM[m] || m) + ' с половиной ' + (m < 5 ? 'минуты' : 'минут');
  return m === 1 ? 'минута' : (NUM[m] || m) + (m < 5 ? ' минуты' : ' минут');
}
// MOT staircase: 2 correct in a row -> up one level; 1 wrong -> down one level.
const MOT = [{n:3,v:1},{n:3,v:1.5},{n:5,v:1},{n:5,v:1.5},{n:7,v:1},{n:7,v:1.5},{n:12,v:1}];
const motK = n => n >= 5 ? 2 : 1;
function motStep(s, correct) {
  if (!correct) return {lvl: Math.max(0, s.lvl - 1), streak: 0};
  return s.streak + 1 >= 2 ? {lvl: Math.min(MOT.length - 1, s.lvl + 1), streak: 0} : {lvl: s.lvl, streak: s.streak + 1};
}
// Breath pacer: phases [kind, seconds, label]; kind in/out/full/empty decides circle size.
const PATTERNS = {
  '4/4':  [['in',4,'Вдох'],['out',4,'Выдох']],
  '4/6':  [['in',4,'Вдох'],['out',6,'Выдох']],
  '5-5-5-5': [['in',5,'Вдох'],['full',5,'Пауза'],['out',5,'Выдох'],['empty',5,'Пауза']],
  '4-7-8': [['in',4,'Вдох'],['full',7,'Задержка'],['out',8,'Выдох']],
};
const BW_PAT = {fast: [['in',1,'Вдох'],['out',1,'Выдох']], calm: [['in',5,'Вдох'],['out',7,'Выдох']], '5/7': [['in',5,'Вдох'],['out',7,'Выдох']], '6/8': [['in',6,'Вдох'],['out',8,'Выдох']],
  res: [['in',5.5,'Вдох'],['out',5.5,'Выдох']], box4: [['in',4,'Вдох'],['full',4,'Пауза'],['out',4,'Выдох'],['empty',4,'Пауза']],
  nadi: [['in',4,'Вдох левой'],['out',6,'Выдох правой'],['in',4,'Вдох правой'],['out',6,'Выдох левой']], kap: [['out',.4,'Выдох'],['in',.8,'']]};
// Breathwork script (пост в канале 21.01.2024): psy = продышка до касания, выдох-держи, вдох-держи (+до-вдох), в конце сидим 20+ мин и ещё 5; wh = 30 вдохов, выдох-держи, вдох 15 с.
function bwSteps(mode, rounds) {
  const out = [];
  for (let r = 1; r <= rounds; r++) out.push(mode === 'wh' ? {k: 'breathe', r, n: 30} : {k: 'breathe', r, n: 0}, {k: 'exh', r}, mode === 'wh' ? {k: 'rec', r} : {k: 'inh', r});
  if (mode !== 'wh') out.push({k: 'sit', r: rounds}, {k: 'more', r: rounds}, {k: 'note', r: rounds});
  return out;
}
const PAT_LEN = pat => (PATTERNS[pat] || BW_PAT[pat]).reduce((a, p) => a + p[1], 0);
const PAT_AT = (pat, t) => { const ph = PATTERNS[pat] || BW_PAT[pat]; t = ((t % PAT_LEN(pat)) + PAT_LEN(pat)) % PAT_LEN(pat); let i = 0; for (const p of ph) { if (t < p[1]) return i; t -= p[1]; i++; } return 0; };
const SMALL = .4, ease = x => (1 - Math.cos(Math.PI * x)) / 2;
function breathPhase(pat, t) {
  const ph = PATTERNS[pat] || BW_PAT[pat], cyc = ph.reduce((a, p) => a + p[1], 0);
  t = ((t % cyc) + cyc) % cyc;
  for (const [kind, sec, label] of ph) {
    if (t < sec) {
      const x = t / sec;
      const scale = kind === 'in' ? SMALL + (1 - SMALL) * ease(x) : kind === 'out' ? 1 - (1 - SMALL) * ease(x) : kind === 'full' ? 1 : SMALL;
      return {label, left: sec - t, scale};
    }
    t -= sec;
  }
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---- Игры внимания: каталог (Projects/attention-school/игры.md) ---- */
// guided: cues [[сек | доля 0..1 | −сек от конца, текст]] и/или alt по кругу каждые every с, ping — случайные сигналы 20–60 с; lo/max — границы минут.
const GROUPS = ['Внимание', 'Awareness Games', 'Задержка как игра', 'Дыхание', 'Днём'], GROUP_ORDER = [3, 2, 0, 1, 4];
const MECHS = ['guided', 'counter', 'stopwatch', 'pacer', 'slider', 'periphery', 'holdpair', 'seq', 'card', 'link'];
const TIMED = ['guided', 'counter', 'pacer', 'periphery'];
const GAMES = [
  {id: 'apart', group: 0, title: 'Внимание отдельно от взгляда', min: 3, mech: 'guided', every: 10,
    text: 'Глаза стоят на точке перед тобой и не двигаются. Внимание ходит отдельно: в одну сторону, в другую, вверх, вниз, по краю поля зрения.',
    alt: ['Внимание влево. Глаза на точке', 'Вправо', 'Влево', 'Вправо', 'Вверх', 'Вниз', 'По краю поля по часовой', 'Против часовой']},
  {id: 'ad1', group: 0, title: 'AD-1 · знакомство', min: 5, mech: 'guided',
    text: 'Мягкий взгляд на точке. Держи в поле внимания левую зону, потом обе стороны, потом четыре, потом всю периферию. Растяни до 5–10 минут.',
    cues: [[0, 'Левая зона поля зрения'], [.15, 'Левая и правая зоны вместе'], [.4, 'Четыре зоны: лево, право, верх, низ'], [.65, 'Вся периферия сразу']]},
  {id: 'ad2', group: 0, title: 'AD-2 · вращение', min: 5, mech: 'guided',
    text: 'Мягкий взгляд на точке. Проведи вниманием 3–5 кругов по краю поля зрения, потом расширяй поле, пока оно не заполнит всё.',
    cues: [[0, 'Круг вниманием по краю поля зрения. Глаза на точке'], [.5, 'Расширяй: пусть поле заполнит всё']]},
  {id: 'ad3', group: 0, title: 'AD-3 · плоскость', min: 5, max: 10, mech: 'guided',
    text: 'Всё, что видишь, это плоская картинка без глубины. Можно помочь себе треугольником из рук. Не дольше 10 минут за раз.',
    cues: [[0, 'Поле зрения как плоская картинка'], [.5, 'Без глубины. Только плоскость']]},
  {id: 'ad4', group: 0, title: 'AD-4 · объём', min: 5, mech: 'guided',
    text: 'Теперь поле объёмное: пространство вокруг, а не только перед глазами. Внимание на всём объёме сразу.',
    cues: [[0, 'Объёмное поле: спереди, сбоку, сзади'], [.5, 'Всё пространство сразу']]},
  {id: 'plane', group: 0, title: 'Абстрактная плоскость зрения', min: 3, mech: 'guided',
    text: 'Смотри на всё как на пятна цвета и света, без названий предметов. Начни с 2–3 минут, потом 5, потом 10. Идёт после AD.',
    cues: [[0, 'Только цвет и свет, без названий'], [.5, 'Пятна, границы, яркость']]},
  {id: 'ad5', group: 0, title: 'AD-5 · слух', min: 8, lo: 5, mech: 'guided',
    text: 'Сначала 3–5 минут плоского зрения с закрытыми глазами. Потом слушай все звуки сразу и склеивай их по времени прихода, не по источникам. Ищи паузы между звуками.',
    cues: [[0, 'Глаза закрыты. Плоское поле зрения'], [.4, 'Теперь все звуки сразу, без источников'], [.6, 'Склей звуки, пришедшие почти вместе'], [.8, 'Найди паузы между звуками']]},
  {id: 'ad6', group: 0, title: 'AD-6 · тело', min: 15, lo: 10, mech: 'guided',
    text: 'Сначала 3–5 минут плоского зрения. Потом ощущения тела: поверхность, внутреннее тепло, всё тело одним фоном. Выход строго по порядку: кожа, звуки, глаза.',
    cues: [[0, 'Глаза закрыты. Плоское поле зрения'], [.25, 'Ощущения поверхности тела: одежда, пол, стул'], [.4, 'Внутренние ощущения. Начни с тепла'], [.6, 'Всё тело одним фоном, без картинок'],
      [-70, 'Выход: вернись к ощущениям кожи'], [-40, 'Теперь звуки вокруг'], [-15, 'Открой глаза']]},
  {id: 'soundmap', group: 0, title: 'Звуковая карта', min: 6, mech: 'counter', btns: ['Новый звук'],
    text: 'Закрой глаза. Слушай всё сразу, ничего не выбирая. На каждый новый звук нажимай кнопку.'},
  {id: 'pulse', group: 0, title: 'Пульсирующий взгляд', min: 6, mech: 'pacer', pat: '4/6', lab: {'Вдох': 'шире', 'Выдох': 'уже'},
    text: 'Взгляд на точке. На вдохе поле зрения шире, на выдохе чуть уже, но без фокуса на точку. Дыши носом.'},
  {id: 'periph', group: 0, title: 'Периферия на экране', min: 3, mech: 'periphery',
    text: 'Смотри на точку в центре. Когда на краю мелькнёт вспышка, коснись экрана, не двигая глаз. Зона растёт: слева, с обеих сторон, со всех краёв.'},
  {id: 'triangle', group: 0, title: 'Треугольник', min: 3, mech: 'guided',
    text: 'Пальцы треугольником в 30 см от лица. Минуту смотри на контур. Потом медленно разводи руки, а взгляд не меняй.',
    cues: [[0, 'Треугольник из пальцев. Взгляд на контуре'], [.34, 'Разводи руки медленно. Взгляд не меняй'], [.67, 'Руки разведены. Видишь всё поле сразу']]},

  {id: 'will', group: 0, title: 'Волевая медитация', min: 5, mech: 'guided',
    text: 'Спина прямая. Формула «Я есмь» в три фазы: проговариваешь про себя, потом она звучит без артикуляции, потом разворачивается молча. Отвлёкся, вернись. Спина ушла, значит медитация кончилась. В курикулуме 5 минут в начале тренировки.',
    cues: [[0, 'Спина прямая. Про себя: Я есмь'], [.35, 'Пусть звучит без артикуляции'], [.65, 'Молча, без слов'], [-10, 'Выход. Открой глаза']]},
  {id: 'dot', group: 0, title: 'Точка · концентрация', min: 1, mech: 'guided',

  {id: 'catch', group: 1, title: 'Поймай дыхание', mech: 'link', to: 'silence',
    text: 'Тёмный экран и случайные сигналы. На сигнал заметь, дышишь ли ты и как. Дыхание не меняй.'},

  {id: 'wi-screen', group: 1, title: 'Где это происходит · экран', min: 3, mech: 'guided', every: 35,

  {id: 'wi-mind', group: 1, title: 'Где это происходит · пустой ум', min: 3, mech: 'guided', every: 35,
    text: 'Пусть ум будет пустым сосудом, в который заглядывают мысли и чувства. Мысли приходят и уходят, а ум остаётся тем же.',

  {id: 'wi-time', group: 1, title: 'Где это происходит · время', min: 3, mech: 'guided', every: 35,

      <p class="muted">Во время тренировки голос объявляет блоки, они идут сами. Задержку начинаешь и заканчиваешь касанием в любом месте экрана: можно закрыть глаза.</p>`,
    2: `${head}<h1>Безопасность</h1>
      <div class="warn">Задержки и брезворк — только сидя или лёжа, на суше. Не в воде, не в ванне, не за рулём.</div>
      <p class="muted">В воде — только с напарником, который смотрит на тебя.</p>
      <p class="muted">Сначала поговори с врачом, если есть: болезни сердца или высокое давление; эпилепсия, обмороки, инсульт; астма и болезни лёгких; психические расстройства; диабет; беременность.</p>`,
    3: `${head}<h1>Добавь на экран «Домой»</h1>
      <p>${ios ? 'В Safari: кнопка «Поделиться» внизу → «На экран „Домой“».' : 'В Chrome: меню ⋮ → «Добавить на главный экран» или «Установить приложение».'}</p>
      <p class="muted">Приложение откроется с иконки, на весь экран. Добавь до первой практики: прогресс хранится отдельно в браузере и в приложении на экране.</p>
      ${installEvt ? '<button class="btn" data-act="install">Установить</button>' : ''}`,
  }[n];
  shell({back: false, title: '', body,
    foot: `<button class="btn primary" data-act="nx">${n < steps ? (n === 2 ? 'Понятно' : 'Дальше') : 'Начать'}</button>`});
  A.nx = () => n < steps ? go('welcome?s=' + (n + 1)) : done();
  A.install = () => { installEvt.prompt(); installEvt.userChoice.then(() => { installEvt = null; done(); }); };
};

/* ---- Сегодня ---- */
SCREENS.today = () => {
  const ids = plan(), total = ids.reduce((a, id) => a + blockLen(id), 0);
  const {i: si, k} = stageOf(S.day), st = STAGES[si], wk = Math.floor((k - 1) / 7), ci = (S.day - 1) % CARDS.length;
  const segs = [...Array(7)].map((_, j) => `<i class="${j + 1 < k - wk * 7 ? 'done' : j + 1 === k - wk * 7 ? 'now' : ''}"></i>`).join('');
  const last = S.notes[S.notes.length - 1], doneToday = S.today.done || 0;
  shell({back: false, title: doneToday ? `Сегодня пройдено: ${doneToday}` : '', body: `
    <div><h2>${st.name} · ${si ? `неделя ${wk + 1} · тренировка ${k - wk * 7} из 7` : `тренировка ${k} из 7`}</h2><div class="path" style="margin-top:10px">${segs}</div></div>
    <div class="card">
      <h2>Карточка · 3 мин</h2>
      <h1>${CARDS[ci]}</h1>
      <p class="muted">${EXCERPTS[ci]}</p>
    </div>
    <div class="row" style="align-items:baseline"><h2>Практика</h2><span class="muted small">${Math.round(total / 60)} мин</span></div>
    <div class="plan">${ids.map(id => `<div class="item"><span class="name">${titleOf(id)}</span>
      ${id.startsWith('g:') && !gOf(id).min ? `<span class="step"><b>≈ ${fmt(blockLen(id))}</b></span>` : `<span class="step"><button data-act="step" data-v="${id}:-1" aria-label="меньше">−</button><b>${fmt(blockLen(id))}</b><button data-act="step" data-v="${id}:1" aria-label="больше">+</button></span>`}</div>`).join('')}</div>
    <button class="sw ${S.minimal ? 'on' : ''}" data-act="minimal"><span>Плохой день · 5 мин</span><s></s></button>
    <h2>Отдельно</h2>
    <div class="links"><a href="#games" class="wide">Практики · ${GAMES.length}</a><a href="#breath">Дыхание</a><a href="#schulte">Шульте</a><a href="#silence">Тишина</a><a href="#wordless">Без слов</a><a href="#pool" class="${S.entryDone ? '' : 'lock'}">Вода${S.entryDone ? '' : ' · закрыто'}</a><a href="#hold">Задержка</a><a href="#breathwork" class="wide">Брезворк</a><a href="#welcome" class="wide">Как это устроено</a></div>
    ${last ? `<p class="muted small">Заметка, тренировка ${last.day}: «${esc(last.text)}»</p>` : ''}
    <button class="btn quiet" data-act="reset">Сбросить прогресс (прототип)</button>`,
    foot: `<button class="btn primary" data-act="start">Начать</button>`});
  A.step = v => { const [id, d] = v.split(/:(?=-?1$)/); if (id.startsWith('g:')) { const g = gOf(id); S.gmin[g.id] = Math.min(g.max || 30, Math.max(g.lo || .5, gmin(g) + +d)); } else { const b = BLOCKS[id]; S.len[id] = Math.max(b.min, blockLen(id) + d * b.step); } save(); SCREENS.today(); };
  A.minimal = () => { S.minimal = !S.minimal; save(); SCREENS.today(); };
  A.start = () => { run = {ids: plan(), i: 0}; pendingSay = 'Тренировка ' + S.day + '. ' + sayBlock(run.ids[0]); go(routeOf(run.ids[0])); };
  A.reset = () => { if (confirm('Стереть весь прогресс на этом устройстве?')) { localStorage.removeItem(KEY); S = fresh(); SCREENS.today(); } };
};

/* ---- Дыхание ---- */
SCREENS.breath = p => {
  const id = p.get('b') || 'b1', total = blockLen(id);
  let pat = S.pat, t0 = 0, running = false;
  const draw = () => {
    shell({title: titleOf(id), body: `
      <div class="chips">${Object.keys(PATTERNS).map(k => `<button class="chip ${k === pat ? 'on' : ''}" data-act="pat" data-v="${k}" ${running ? 'disabled' : ''}>${k}</button>`).join('')}<button class="chip ${S.sound === false ? '' : 'on'}" data-act="snd">звук</button></div>
      <div class="center"><div class="pacer"><div class="circ" id="circ"></div></div><div class="lab"><b id="lab">Готов</b><span id="cd">${fmt(total)}</span></div>
      <p class="muted small" id="hint">${running ? 'Глаза можно закрыть. Дыхание спокойное, без усилия.' : 'Живот, потом грудь. Спокойно: вдох не глубже комфортного.'}</p></div>`,
      foot: `<button class="btn primary" data-act="go">${running ? 'Закончить' : 'Начать'}</button>`});
    A.pat = v => { pat = v; S.pat = v; save(); draw(); };
    A.snd = () => { S.sound = S.sound === false; save(); draw(); };
    A.go = () => running ? next() : start();
  };
  const start = () => { running = true; t0 = performance.now(); lastCue = ''; draw(); try { ac(); } catch (e) {} };
  let lastCue = '';
  draw();
  loop(now => {
    if (!running) return;
    const t = (now - t0) / 1000, c = $('#circ'); if (!c) return;
    if (t >= total) { running = false; return next(); }
    const ph = breathPhase(pat, t);
    c.style.transform = `scale(${ph.scale})`;
    const cue = ph.label + Math.floor(t / PAT_LEN(pat)) + PAT_AT(pat, t);
    if (cue !== lastCue) { lastCue = cue; tone({'Вдох': 440, 'Выдох': 330}[ph.label] || 392, ph.label === 'Вдох' || ph.label === 'Выдох' ? .14 : .07, .6); }
    $('#lab').textContent = ph.label; $('#cd').textContent = Math.round(ph.left);
    $('#hint').textContent = 'Осталось ' + fmt(total - t);
  });
  if (p.has('auto')) start();
};

/* ---- Задержка ---- */
SCREENS.hold = p => {
  const id = p.get('b') || 'h1', target = blockLen(id);
  const banner = `<div class="warn">${SAFETY}</div>`;
  const toggles = () => `<div class="row" style="gap:8px"><button class="sw ${S.hide ? 'on' : ''}" data-act="hide"><span>скрыть таймер</span><s></s></button><button class="sw ${S.voice ? 'on' : ''}" data-act="voice"><span>голос</span><s></s></button></div>`;
  const ready = () => {
    if (holdStop(S.today.ratings)) return doneScreen('На сегодня задержек хватит', ['Две тяжёлые подряд. Остальное можно, без задержек.'], 'Дальше');
    shell({title: 'Задержка', body: `${banner}
      <div class="center"><div class="huge dim" id="big">${S.hide ? '· ·' : '0:00'}</div><p class="muted">Цель ${fmt(target)}. Не рекорд: выйди, когда захочешь.</p></div>${toggles()}`,
      foot: `<button class="btn primary" data-act="go">Начать задержку</button>`});
    A.go = begin; A.hide = () => { S.hide = !S.hide; save(); ready(); }; A.voice = () => { S.voice = !S.voice; save(); ready(); };
    if (run) $('.body').addEventListener('pointerdown', e => { if (!e.target.closest('button')) begin(); });
  };
  const begin = () => {
    const t0 = performance.now(); let lastCue = 0, over = false; tone(440, .1, .3);
    shell({title: 'Задержка', cls: '', body: `${banner}
      <div class="center" id="tap" style="cursor:pointer"><div class="huge ${S.hide ? 'dim' : ''}" id="big">${S.hide ? '· ·' : '0:00'}</div><p class="muted">Коснись экрана, чтобы закончить</p></div>`});
    every(() => {
      const sec = (performance.now() - t0) / 1000;
      if (!S.hide) $('#big').textContent = fmt(Math.floor(sec));
      const c = Math.floor(sec / 30);
      if (c > lastCue) { lastCue = c; speak(cueText(c * 30)); }
      if (!over && sec >= target) { over = true; if (!S.hide) $('#big').style.color = 'var(--ok)'; }
    }, 100);
    $('#tap').parentNode.addEventListener('pointerdown', () => stop((performance.now() - t0) / 1000), {once: true});
  };
  const stop = held => {
    cleanups.forEach(f => f()); cleanups = [];
    try { speechSynthesis.cancel(); } catch (e) {}
    speak('Оцени. Верх экрана: легко. Середина: нормально. Низ: тяжело');
    shell({back: false, title: 'Держал ' + fmt(held), body: `<div class="rate thirds">${[['easy', 'легко', '+10 с в следующий раз'], ['ok', 'нормально', 'столько же'], ['hard', 'тяжело', '−10 с в следующий раз']].map(([k, l, s]) => `<button class="btn" data-act="rate" data-v="${k}">${l}<small>${s}</small></button>`).join('')}</div>`});
    A.rate = r => {
      S.today.ratings.push(r); S.len[id] = nextHold(target, r);
      S.log.push({t: Date.now(), type: 'hold', id, target, held: Math.round(held), r}); save();
      if (holdStop(S.today.ratings)) return doneScreen('На сегодня задержек хватит', ['Две тяжёлые подряд. Остальные задержки сегодня пропущены.'], 'Дальше');
      if (run) return next();
      doneScreen('Записал', [`В следующий раз: ${fmt(S.len[id])}`], 'Готово');
    };
  };
  ready();
  if (p.has('auto')) begin();
};

/* ---- Внимание: Бильярд (MOT) ---- */
SCREENS.mot = p => {
  const id = p.get('b') || 'mot', total = blockLen(id), R = 14;
  shell({title: 'Бильярд', body: `<div class="status" id="st">Следи за выделенными шарами</div>
    <canvas id="cv"></canvas>
    <p class="muted small" id="info"></p>`,
    foot: `<button class="btn primary" data-act="go" id="go">Начать</button><button class="btn quiet" data-act="end">Закончить</button>`});
  const cv = $('#cv'), W = cv.clientWidth || 358, dpr = 2; cv.width = W * dpr; cv.height = W * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const C = {ball: css('--ball'), acc: css('--accent'), ok: css('--ok'), bad: css('--bad'), line: css('--line'), hi: css('--warn')};
  let ph = 'idle', t = 0, elapsed = 0, balls = [], targets = new Set(), picks = new Set(), K = 1, rounds = 0, hits = 0;
  const st = m => { $('#st').textContent = m; };
  const info = () => { const L = MOT[S.mot.lvl]; $('#info').textContent = `Уровень ${S.mot.lvl + 1}/${MOT.length} · шаров ${L.n} · целей ${motK(L.n)} · ${ph === 'idle' ? '' : 'осталось ' + fmt(Math.max(0, total - elapsed))}`; };
  function seed() {
    const L = MOT[S.mot.lvl]; K = motK(L.n); balls = [];
    for (let i = 0; i < L.n; i++) {
      let x, y, k = 0;
      do { x = R + Math.random() * (W - 2 * R); y = R + Math.random() * (W - 2 * R); k++; } while (k < 200 && balls.some(b => Math.hypot(b.x - x, b.y - y) < 2.4 * R));
      const a = Math.random() * 6.283, v = 70 * L.v; balls.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v});
    }
    targets = new Set(shuffle([...balls.keys()]).slice(0, K)); picks = new Set();
  }
  function round() { seed(); ph = 'show'; t = 0; st(K === 1 ? 'Запомни выделенный шар' : 'Запомни выделенные шары (' + K + ')'); tone(587, .14, .5); buzz(); info(); }
  function move(dt) {
    for (const b of balls) { b.x += b.vx * dt; b.y += b.vy * dt; if (b.x < R || b.x > W - R) { b.vx *= -1; b.x = Math.min(W - R, Math.max(R, b.x)); } if (b.y < R || b.y > W - R) { b.vy *= -1; b.y = Math.min(W - R, Math.max(R, b.y)); } }
    for (let i = 0; i < balls.length; i++) for (let j = i + 1; j < balls.length; j++) {
      const a = balls[i], c = balls[j], dx = c.x - a.x, dy = c.y - a.y, d = Math.hypot(dx, dy); if (!d || d >= 2 * R) continue;
      const nx = dx / d, ny = dy / d, dvn = (a.vx - c.vx) * nx + (a.vy - c.vy) * ny;
      if (dvn > 0) { a.vx -= dvn * nx; a.vy -= dvn * ny; c.vx += dvn * nx; c.vy += dvn * ny; }
      const o = (2 * R - d) / 2; a.x -= nx * o; a.y -= ny * o; c.x += nx * o; c.y += ny * o;
    }
  }
  function draw() {
    g.clearRect(0, 0, W, W);
    balls.forEach((b, i) => {
      const isT = targets.has(i), pk = picks.has(i);
      g.beginPath(); g.arc(b.x, b.y, R, 0, 6.283);
      g.fillStyle = ph === 'show' && isT ? C.hi : ph === 'reveal' && isT ? C.ok : ph === 'reveal' && pk ? C.bad : C.ball; g.fill();
      if (ph === 'show' && isT) { g.lineWidth = 4; g.strokeStyle = C.hi; g.beginPath(); g.arc(b.x, b.y, R + 7, 0, 6.283); g.stroke(); }
      if (pk && ph === 'pick') { g.lineWidth = 3; g.strokeStyle = C.acc; g.beginPath(); g.arc(b.x, b.y, R + 4, 0, 6.283); g.stroke(); }
    });
  }
  loop((now, dt) => {
    if (!cv.isConnected) return;
    if (ph !== 'idle') elapsed += dt; t += dt;
    if (ph === 'show' && t >= 3) { ph = 'move'; t = 0; st('Следи'); tone(440, .1, .4); }
    else if (ph === 'move') { for (let r = dt; r > 0; r -= .03) move(Math.min(.03, r)); if (t >= 8) { ph = 'pick'; t = 0; st('Стоп'); tone(523, .14, .6); buzz(); } }
    else if (ph === 'reveal' && t >= 1.6) { if (elapsed >= total) return end(); round(); }
    if (ph !== 'idle') info();
    draw();
  });
  cv.addEventListener('pointerdown', e => {
    if (ph !== 'pick') return;
    const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * W / r.height;
    let bi = -1, bd = 34; balls.forEach((b, i) => { const d = Math.hypot(b.x - x, b.y - y); if (d < bd) { bd = d; bi = i; } });
    if (bi < 0) return;
    if (picks.has(bi)) { picks.delete(bi); st('Отметь ' + (K === 1 ? 'шар' : K + ' шара')); return; }
    picks.add(bi);
    if (picks.size < K) return st('Отметь ещё ' + (K - picks.size) + ' · коснись отмеченного, чтобы снять');
    const ok = [...picks].every(i => targets.has(i)); rounds++; hits += ok; S.mot = motStep(S.mot, ok); save();
    ph = 'reveal'; t = 0; st(ok ? 'Верно' : 'Мимо'); info(); tone(ok ? 660 : 262, .12, .6);
  });
  const end = () => { S.log.push({t: Date.now(), type: 'mot', rounds, hits, lvl: S.mot.lvl}); save(); doneScreen('Бильярд', [`Раундов ${rounds}, верно ${hits}`, `Уровень теперь ${S.mot.lvl + 1} из ${MOT.length}`]); };
  A.go = () => { $('#go').style.display = 'none'; round(); };
  A.end = end;
  seed(); targets = new Set(); info(); draw();
  if (p.has('auto')) A.go();
};

/* ---- Шульте ---- */
SCREENS.schulte = p => {
  let n = +(p.get('n') || 5), order = [], cur = 1, t0 = 0, timer = null;
  const best = () => S.best['s' + n];
  const setup = () => { cur = 1; t0 = 0; order = shuffle([...Array(n * n)].map((_, i) => i + 1)); draw(); };
  const draw = () => {
    shell({title: 'Шульте', body: `
      <div class="chips"><button class="chip ${n === 5 ? 'on' : ''}" data-act="size" data-v="5">5×5</button><button class="chip ${n === 7 ? 'on' : ''}" data-act="size" data-v="7">7×7</button></div>
      <p class="muted small">Взгляд в центр, ищи боковым зрением. Касайся чисел по порядку от 1 до ${n * n}.</p>
      <div class="row"><span>Дальше: <b id="nx">${cur}</b></span><b id="tm" style="font-size:22px">0.0</b></div>
      <div class="grid n${n}" style="grid-template-columns:repeat(${n},1fr)">${order.map((v, i) => `<button data-act="cell" data-v="${v}" class="${i === (n * n - 1) / 2 ? 'mid' : ''}">${v}</button>`).join('')}</div>
      <p class="muted small">${best() ? 'Лучшее: ' + best().toFixed(1) + ' с' : 'Лучшего времени ещё нет'}</p>`});
    A.size = v => { n = +v; setup(); };
    A.cell = (v, el) => {
      if (+v !== cur) { el.classList.add('bad'); later(() => el.classList.remove('bad'), 250); return; }
      if (cur === 1) { t0 = performance.now(); timer = setInterval(() => { const m = $('#tm'); m && (m.textContent = ((performance.now() - t0) / 1000).toFixed(1)); }, 100); onLeave(() => clearInterval(timer)); }
      el.classList.add('hit'); cur++;
      if (cur > n * n) {
        clearInterval(timer); const sec = (performance.now() - t0) / 1000;
        const key = 's' + n, nb = !S.best[key] || sec < S.best[key]; if (nb) S.best[key] = sec; save();
        return doneScreen(sec.toFixed(1) + ' с', [nb ? 'Новое лучшее время' : 'Лучшее: ' + S.best[key].toFixed(1) + ' с'], 'Ещё раз', setup);
      }
      $('#nx').textContent = cur;
    };
  };
  setup();
  if (p.has('auto')) { A.cell('1', $('.grid button[data-v="1"]')); }
};

/* ---- Тишина ---- */
SCREENS.silence = p => silence(p, p.get('tab') || 'catch');
SCREENS.wordless = p => silence(p, 'word');
function silence(p, tab) {
  const id = p.get('b') || 'sil';
  let total = blockLen(id);
  const tabs = `<div class="chips"><button class="chip ${tab === 'catch' ? 'on' : ''}" data-act="tab" data-v="catch">Поймай дыхание</button><button class="chip ${tab === 'word' ? 'on' : ''}" data-act="tab" data-v="word">Без слов</button></div>`;
  A.tab = v => { run = run && v === 'catch' ? run : null; go(v === 'catch' ? 'silence' : 'wordless'); };
  if (tab === 'word') {
    let t0 = 0, state = 'idle';
    const draw = (res) => {
      shell({title: 'Без слов', body: `${tabs}<div class="center">
        <div class="huge ${state === 'run' ? 'dim' : ''}" style="font-size:${state === 'run' ? 40 : 64}px" id="big">${state === 'run' ? 'без слов…' : res ? res.toFixed(1) + ' с' : '·'}</div>
        <p class="muted">${state === 'run' ? 'Нажми, когда в голове появится первое слово.' : 'Побудь без слов в голове. Когда появится первое слово, нажми. Не борись со словами: просто отметь.'}</p>
        <p class="muted small">${S.best.word ? 'Лучшее: ' + S.best.word.toFixed(1) + ' с' : 'Лучшего времени ещё нет'}</p></div>`,
        foot: `<button class="btn primary" data-act="go">${state === 'run' ? 'Слово!' : 'Начать'}</button>`});
      A.go = () => { if (state === 'run') { const s = (performance.now() - t0) / 1000; if (!S.best.word || s > S.best.word) S.best.word = s; save(); state = 'idle'; draw(s); } else { state = 'run'; t0 = performance.now(); draw(); } };
    };
    draw();
    if (p.has('auto')) A.go();
    return;
  }
  let running = false, more = false, pings = 0, t0 = 0, pingAt = 0, shown = 0;
  const nextPing = from => from + 20 + Math.random() * 40;
  const draw = () => {
    shell({title: running ? '' : 'Тишина', cls: running ? 'dark' : '', body: running
      ? `<div class="center"><p class="ping" id="ping"></p>${more ? '<p class="muted">Посиди ещё пять минут</p>' : ''}</div><p class="faint small" style="text-align:center" id="rem">${fmt(Math.ceil(total - (performance.now() / 1000 - t0)))}</p>`
      : `${tabs}<div class="center"><h1>Поймай дыхание</h1><p class="muted">Экран тёмный. В случайный момент, раз в 20–60 с, прозвучит мягкий сигнал. Заметь: дышишь ли ты, и как. Не меняй дыхание.</p><p class="muted small">${fmt(total)} · вибрация и звук</p></div>`,
      foot: `<button class="btn ${running ? 'quiet' : 'primary'}" data-act="go">${!running ? 'Начать' : more ? 'Закончить' : 'Хочу встать'}</button>`});
    // «Когда уже точно хочется встать — посиди ещё пять минут» (пост в канале 21.01.2024).
    A.go = () => !running ? begin() : more ? finish() : (more = true, total = performance.now() / 1000 - t0 + 300, draw());
  };
  const finish = () => { running = false; S.log.push({t: Date.now(), type: 'silence', id, pings}); save(); doneScreen('Тишина', [`Сигналов: ${pings}`]); };
  const begin = () => { running = true; t0 = performance.now() / 1000; pingAt = nextPing(0); draw(); beep(); };
  draw();
  loop(now => {
    if (!running) return;
    const t = now / 1000 - t0, ping = $('#ping'); if (!ping) return;
    if (t >= total) return finish();
    $('#rem').textContent = fmt(total - t);
    if (t >= pingAt) { pingAt = nextPing(t); pings++; shown = t; ping.textContent = 'Поймал? Не меняй его.'; beep(); buzz(); }
    else if (shown && t - shown > 6) { ping.textContent = ''; shown = 0; }
  });
  if (p.has('auto')) { begin(); later(() => { pingAt = 0; }, 800); }
}

/* ---- Брезворк ---- */
SCREENS.breathwork = p => {
  const LABEL = {breathe: 'Продышка', exh: 'Задержка на выдохе', inh: 'Задержка на вдохе', rec: 'Восстановление', sit: 'Тишина', more: 'Ещё пять минут'};
  const DESC = {psy: 'Продышка как у Вима Хофа: секунда вдох, секунда выдох, чем больше, тем лучше. Потом полный выдох и держишь сколько можно, полный вдох и держишь, до-вдох. В конце сидишь с закрытыми глазами 20+ минут; захочется встать — ещё пять.',
    wh: '30 вдохов, выдох и держишь, вдох на 15 секунд. Три раунда.'};
  const banner = `<div class="warn">${BW_SAFETY}</div>`, B = S.bw;
  let steps, i, t0, cueDone, cur, rows;
  const dur = s => ({breathe: s.n ? 2 * s.n : Infinity, rec: 15, sit: Infinity, more: 300})[s.k];
  const setup = () => {
    const wh = B.mode === 'wh', row = (id, name, v) => `<div class="item"><span class="name">${name}</span><span class="step"><button data-act="bw" data-v="${id}:-1" aria-label="меньше">−</button><b>${v}</b><button data-act="bw" data-v="${id}:1" aria-label="больше">+</button></span></div>`;
    shell({title: 'Брезворк', body: `${banner}
      <div class="seg"><button class="${wh ? '' : 'on'}" data-act="mode" data-v="psy">Психоделическое</button><button class="${wh ? 'on' : ''}" data-act="mode" data-v="wh">Вим Хоф</button></div>
      <p class="muted small">${DESC[B.mode]}</p>
      ${wh ? '' : `<div class="plan">${row('rounds', 'Раундов', B.rounds)}</div>`}
      <button class="sw ${S.voice ? 'on' : ''}" data-act="voice"><span>голос</span><s></s></button>`,
      foot: `<button class="btn primary" data-act="go">Начать</button>`});
    A.mode = v => { B.mode = v; save(); setup(); };
    A.bw = v => { B.rounds = Math.min(6, Math.max(1, B.rounds + +v.split(':')[1])); save(); setup(); };
    A.voice = () => { S.voice = !S.voice; save(); setup(); };
    A.go = () => { const wh = B.mode === 'wh'; steps = bwSteps(B.mode, wh ? 3 : B.rounds); rows = []; cur = {}; enter(0); };
  };
  const advance = () => i + 1 < steps.length ? enter(i + 1) : (i = -1, doneScreen('Готово', rows.map(r => `Раунд ${r.r}: выдох ${fmt(r.exh)}`)));
  // A hold step ended after sec seconds; the round's last hold is logged to bwLog (never to the hold progression).
  const end = (s, sec) => {
    if (s.k === 'exh') cur.exh = Math.round(sec);
    else if (s.k === 'inh' || s.k === 'rec') { const e = {t: Date.now(), mode: B.mode, r: s.r, n: cur.n, exh: cur.exh, [s.k]: Math.round(sec)}; bwRecord(e); rows.push(e); save(); }
    advance();
  };
  const enter = j => {
    i = j; const s = steps[i], rounds = steps.filter(x => x.k === 'exh').length; t0 = performance.now(); cueDone = false;
    if (s.k === 'note') {
      shell({title: 'Брезворк', body: `${banner}<h1>Что видел?</h1><input type="text" id="nt" maxlength="140" placeholder="Одной строкой" autocomplete="off"><p class="muted small">Можно пустую.</p>`,
        foot: `<button class="btn primary" data-act="save">Сохранить</button>`});
      A.save = () => { const text = $('#nt').value.trim(); if (text) { S.bwLog.push({t: Date.now(), mode: B.mode, note: text}); save(); } go('today'); };
      return;
    }
    const head = `${banner}<h2>${s.k === 'sit' ? '' : 'Раунд ' + s.r + ' из ' + rounds + ' · '}${LABEL[s.k]}</h2>`;
    const stop = `<button class="btn quiet" data-act="stop">Остановить</button>`;
    A.stop = () => location.hash === '#breathwork' ? route() : go('breathwork');
    if (s.k === 'breathe') {
      cur.n = s.n;
      shell({title: 'Брезворк', body: `${head}<div class="center"><div class="pacer"><div class="circ" id="circ"></div></div><div class="lab"><b id="lab">Вдох</b><span id="cnt"></span></div>${s.n ? '' : '<p class="muted small">Чем больше, тем лучше</p>'}</div>`,
        foot: (s.n ? '' : `<button class="btn primary" data-act="hold">Выдох — держу</button>`) + stop});
      A.hold = () => { cur.n = Math.floor((performance.now() - t0) / 2000) + 1; advance(); };
      speak('вдох');
    } else if (s.k === 'sit' || s.k === 'more') {
      const sit = s.k === 'sit';
      shell({title: '', cls: 'dark', body: `${head}<div class="center"><p class="muted">${sit ? 'Сиди с закрытыми глазами, спина прямо, следи за дыханием' : 'Посиди ещё пять минут'}</p><div class="huge dim" id="big">${fmt(sit ? 0 : 300)}</div></div>`,
        foot: (sit ? `<button class="btn" data-act="up">Хочу встать</button>` : '') + stop});
      A.up = advance;
    } else {
      const prompt = {exh: 'Полный выдох — держи', inh: 'Полный вдох — держи', rec: 'Вдох — держи 15 с'}[s.k];
      shell({title: 'Брезворк', body: `${head}<div class="center" id="tap"><h1>${prompt}</h1><div class="huge" id="big">${s.k === 'rec' ? 15 : '0:00'}</div><p class="cue" id="cue"></p><p class="muted small">${s.k === 'rec' ? '' : 'Коснись экрана, чтобы закончить'}</p></div>`, foot: stop});
      speak(s.k === 'exh' ? 'выдох, держи' : 'вдох, держи');
      if (s.k !== 'rec') $('#tap').addEventListener('pointerdown', () => { const sec = (performance.now() - t0) / 1000; if (sec >= 1) end(s, sec); });
    }
  };
  setup();
  loop(() => {
    const s = steps && steps[i]; if (!s || s.k === 'note') return;
    const t = (performance.now() - t0) / 1000, big = $('#big');
    if (s.k === 'breathe') {
      if (t >= dur(s)) return advance();
      const ph = breathPhase('fast', t), c = $('#circ'); if (!c) return;
      c.style.transform = `scale(${ph.scale})`; $('#lab').textContent = ph.label;
      $('#cnt').textContent = s.n ? Math.min(s.n, Math.floor(t / 2) + 1) + ' / ' + s.n : Math.floor(t / 2) + 1;
    } else if (s.k === 'sit') {
      if (t >= 1200 && !cueDone) { cueDone = true; beep(); }
      big.textContent = fmt(Math.floor(t));
    } else if (s.k === 'more') {
      if (t >= dur(s)) { beep(); return advance(); }
      big.textContent = fmt(Math.ceil(dur(s) - t));
    } else if (s.k === 'rec') {
      if (t >= dur(s)) return end(s, dur(s));
      big.textContent = Math.ceil(dur(s) - t);
    } else {
      big.textContent = fmt(Math.floor(t));
      if (s.k === 'inh' && t >= 3 && !cueDone) { cueDone = true; $('#cue').textContent = 'до-вдох'; speak('до-вдох'); }
    }
  });
  if (p.has('auto') || /[?&]auto/.test(location.search)) A.go();
};

/* ---- Вода ---- */
SCREENS.pool = p => {
  const unlocked = S.entryDone || p.has('demo');
  if (!unlocked) return shell({title: 'Вода', body: `<div class="center"><div class="lock-ico">ЗАКРЫТО</div><h1>Вода откроется после ступени «Вход»</h1>
    <p class="muted">Сейчас день ${Math.min(S.day, 7)} из 7. В воде — только с напарником; сначала сухая основа и правила безопасности.</p>
    <div class="warn" style="text-align:left">Никогда не ныряй один. На суше сидя или лёжа можно одному, в воде — только со страховкой.</div></div>`});
  const checks = ['Договорились о знаках', 'Без гипервентиляции', 'Напарник смотрит 30 с после всплытия'];
  const ticked = new Set(p.has('demo') ? [0, 1, 2] : []);
  let who = p.has('demo') ? 'Женя' : '', phase = 'check';
  const draw = () => {
    const ok = who.trim() && ticked.size === checks.length;
    shell({title: 'Вода', body: phase === 'log'
      ? `<h1>Как прошло</h1><input type="text" id="lg" maxlength="160" placeholder="Одной строкой"><p class="muted small">Таймера в воде нет. Запиши, как ощущалось.</p>`
      : `<div class="warn">Только с напарником. Отметь всё, чтобы увидеть задание.</div>
      <input type="text" id="who" placeholder="Кто страхует? (имя)" maxlength="40" value="${esc(who)}">
      ${checks.map((c, i) => `<button class="check ${ticked.has(i) ? 'on' : ''}" data-act="tick" data-v="${i}"><i>${ticked.has(i) ? '✓' : ''}</i>${c}</button>`).join('')}
      ${ok ? `<div class="card"><h2>Задание</h2><p style="font-size:18px">Повторный метод: 8 × 20–25 м, отдых до полного восстановления (~2:30)</p><p class="muted small">Без таймера. Страхует ${esc(who.trim())}.</p></div>` : ''}`,
      foot: phase === 'log' ? `<button class="btn primary" data-act="save">Сохранить</button>` : ok ? `<button class="btn primary" data-act="after">Готово, записать</button>` : ''});
    const w = $('#who'); if (w) w.oninput = () => { who = w.value; const ok2 = who.trim() && ticked.size === checks.length; if (!!ok2 !== !!ok) { const pos = w.selectionStart; draw(); const n = $('#who'); n.focus(); n.setSelectionRange(pos, pos); } };
    A.tick = v => { ticked.has(+v) ? ticked.delete(+v) : ticked.add(+v); draw(); };
    A.after = () => { phase = 'log'; draw(); $('#lg').focus(); };
    A.save = () => { S.pool.push({t: Date.now(), who: who.trim(), text: $('#lg').value.trim()}); save(); go('today'); };
  };
  draw();
};

/* ---- Игры внимания ---- */
const gmin = g => S.gmin[g.id] ?? g.min;
const dm = m => m < 1 ? Math.round(m * 60) + ' с' : String(m).replace('.', ',') + ' мин';
const rnd = a => a[Math.random() * a.length | 0];
const meta = g => g.tag || (g.min ? dm(gmin(g)) : g.mech === 'link' ? '›' : '');
const banner = g => g.safe ? `<div class="warn">${g.safe === true ? SAFETY : g.safe === 'bw' ? BW_SAFETY : g.safe}</div>` : '';
const PACER = '<div class="center"><div class="pacer"><div class="circ" id="circ"></div></div><div class="lab"><b id="lab"></b><span id="cd"></span></div></div>';
const pacerTick = (pat, t, lab = {}) => {
  const ph = breathPhase(pat, t), c = $('#circ'); if (!c) return '';
  const l = lab[ph.label] || ph.label; c.style.transform = `scale(${ph.scale})`; $('#lab').textContent = l; $('#cd').textContent = l && PAT_LEN(pat) >= 3 ? Math.round(ph.left) : ''; return l;
};
const fin = (g, res, lines = []) => {
  try { speechSynthesis.cancel(); } catch (e) {}
  S.log.push({t: Date.now(), type: 'game', id: g.id, ...res}); save(); doneScreen(g.title, lines, run ? 'Дальше' : 'Готово', run ? next : () => go('games'));
};
// One timed run: draws once, calls tick(t, total) every frame, finishes at the chosen length or on «Закончить».
function session(g, {body, foot = '', cls = '', init, tick, result = () => ({}), lines = t => ['Сыграно ' + fmt(t)]}) {
  const total = gmin(g) * 60; let over = false, last = 0;
  shell({back: false, cls, body: `${body}<p class="faint small" style="text-align:center" id="rem">${fmt(total)}</p>`, foot: `${foot}<button class="btn quiet" data-act="gend">Закончить</button>`});
  const end = t => { if (over) return; over = true; fin(g, {sec: Math.round(Math.min(t, total)), ...result(t)}, lines(t)); };
  A.gend = () => end(last);
  init && init();
  const t0 = performance.now();
  loop(now => {
    if (over) return;
    last = Math.max(0, (now - t0) / 1000);
    if (last >= total) { beep(); return end(total); }
    $('#rem').textContent = fmt(total - last); tick(last, total);
  });
}
const MECH = {
  link: g => { if (g.bw) { S.bw.mode = g.bw; save(); } go(g.to); },
  guided(g) {
    const total = gmin(g) * 60, cues = gcues(g, total); let i = 0, pings = 0, nextP = g.ping ? 20 + Math.random() * 40 : Infinity, shown = 0;
    session(g, {cls: 'dark', body: `<div class="center"><p class="ping" id="ping"></p>${g.ping ? '<p class="muted small">Жди сигнала</p>' : ''}</div>`,
      init: beep,
      tick(t) {
        const e = $('#ping');
        while (i < cues.length && t >= cues[i][0]) { e.textContent = cues[i][1]; speak(cues[i++][1]); }
        if (t >= nextP) { nextP = t + 20 + Math.random() * 40; pings++; e.textContent = rnd(g.ping); shown = t; beep(); buzz(); }
        else if (shown && t - shown > 6) { e.textContent = ''; shown = 0; }
      },
      result: () => g.ping ? {pings} : {}, lines: t => g.ping ? [`Сигналов: ${pings}`] : ['Сыграно ' + fmt(t)]});
  },
  counter(g) {
    if (g.daily) return daily(g);
    const n = g.btns.map(() => 0); let nextP = g.ping ? 20 + Math.random() * 40 : Infinity, shown = 0;
    A.cnt = v => { $('#c' + v).textContent = ++n[v]; tone(523, .08, .2); };
    session(g, {body: `<div class="center"><p class="muted small">${esc(g.text)}</p><p class="cue" id="ping"></p></div>
      <div class="rate">${g.btns.map((l, i) => `<button class="btn" data-act="cnt" data-v="${i}"><span>${l}</span><b id="c${i}">0</b></button>`).join('')}</div>`,
      tick(t) {
        if (t >= nextP) { nextP = t + 20 + Math.random() * 40; $('#ping').textContent = rnd(g.ping); shown = t; beep(); buzz(); }
        else if (shown && t - shown > 6) { $('#ping').textContent = ''; shown = 0; }
      },
      result: () => ({n}), lines: () => g.btns.map((l, i) => `${l}: ${n[i]}`)});
    if (g.btns.length === 1) $('.body').addEventListener('pointerdown', e => { if (!e.target.closest('button')) A.cnt(0); });
  },
  stopwatch(g) {
    const key = 'g_' + g.id, t0 = performance.now();
    shell({back: 'games', title: g.title, body: `<div class="center"><div class="huge dim" id="big">0:00</div><p class="muted">${esc(g.text)}</p>
      <p class="muted small">${S.best[key] ? 'Лучшее: ' + S.best[key].toFixed(1) + ' с' : 'Лучшего времени ещё нет'}</p></div>`,
      foot: `<button class="btn primary" data-act="gtap">${g.tap}</button>`});
    every(() => { const b = $('#big'); b && (b.textContent = fmt((performance.now() - t0) / 1000)); }, 200);
    A.gtap = () => {
      const s = (performance.now() - t0) / 1000, nb = !S.best[key] || s > S.best[key]; if (nb) S.best[key] = s;
      fin(g, {sec: Math.round(s)}, [s.toFixed(1) + ' с', nb ? 'Новое лучшее время' : 'Лучшее: ' + S.best[key].toFixed(1) + ' с']);
    };
  },
  pacer(g) {
    let last = '';
    session(g, {body: PACER, tick: t => { const l = pacerTick(g.pat, t, g.lab); if (l !== last) { last = l; speak(l); } }});
  },
  slider(g) {
    let i = 0, lo = 50, hi = 50, v = 50;
    const draw = () => {
      shell({back: 'games', title: `${i + 1} из ${g.prompts.length}`, body: `<div class="center"><p style="font-size:22px;line-height:1.3">${esc(g.prompts[i])}</p></div>
        <input type="range" id="sl" min="0" max="100" value="${v}"><div class="row muted small"><span>ослабить</span><span>усилить</span></div>`,
        foot: `<button class="btn primary" data-act="gnext">${i + 1 < g.prompts.length ? 'Дальше' : 'Готово'}</button>`});
      $('#sl').oninput = e => { v = +e.target.value; lo = Math.min(lo, v); hi = Math.max(hi, v); };
    };
    A.gnext = () => ++i < g.prompts.length ? draw() : fin(g, {lo, hi}, [`Двигал настроение от ${lo} до ${hi} из 100`]);
    draw();
  },
  periphery(g) {
    const ZONES = ['слева', 'слева и справа', 'все края'], css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    let cv, c2, W, fl = null, nextAt = 1.5, hits = 0, miss = 0, fa = 0, lvl = 0, lh = 0;
    const st = m => { $('#st').textContent = m; }, info = () => { $('#info').textContent = `Зона: ${ZONES[lvl]} · верно ${hits} · пропущено ${miss}`; };
    const spawn = () => {
      const r = () => W * (.12 + .76 * Math.random()), e = W * .08, side = lvl === 0 ? 0 : lvl === 1 ? Math.random() < .5 ? 0 : 1 : Math.random() * 4 | 0;
      return side === 0 ? {x: e, y: r()} : side === 1 ? {x: W - e, y: r()} : side === 2 ? {x: r(), y: e} : {x: r(), y: W - e};
    };
    session(g, {body: `<div class="status" id="st">Глаза на точке. Вспышка: коснись экрана</div><canvas id="cv"></canvas><p class="muted small" id="info"></p>`,
      init() {
        cv = $('#cv'); W = cv.clientWidth || 358; cv.width = cv.height = W * 2; c2 = cv.getContext('2d'); c2.scale(2, 2); info();
        $('.body').addEventListener('pointerdown', () => {
          if (fl && !fl.hit) { fl.hit = true; hits++; st('Верно'); if (++lh >= 4 && lvl < 2) { lvl++; lh = 0; } }
          else { fa++; st('Мимо: вспышки не было'); }
          info();
        });
      },
      tick(t) {
        if (!fl && t >= nextAt) fl = {...spawn(), t0: t, hit: false};
        if (fl && t - fl.t0 > 1.2) { if (!fl.hit) { miss++; st('Пропуск'); info(); } fl = null; nextAt = t + 1.5 + Math.random() * 2; }
        c2.clearRect(0, 0, W, W);
        c2.fillStyle = css('--accent'); c2.beginPath(); c2.arc(W / 2, W / 2, 6, 0, 6.283); c2.fill();
        if (fl && t - fl.t0 < .25) { c2.fillStyle = css('--text'); c2.beginPath(); c2.arc(fl.x, fl.y, 10, 0, 6.283); c2.fill(); }
      },
      result: () => ({hits, miss, fa, zone: lvl}), lines: () => [`Верно ${hits} из ${hits + miss}`, `Лишних касаний: ${fa}`, `Дошёл до зоны: ${ZONES[lvl]}`]});
  },
  // seq: steps {p: pattern|null, s, say} (pacer or free breathing for s seconds) and {hold: 'exh', say} (tap to end).
  seq(g) {
    const warn = banner(g), holds = []; let k = 0;
    const reset = () => { cleanups.forEach(f => f()); cleanups = []; try { speechSynthesis.cancel(); } catch (e) {} };
    const step = () => {
      reset();
      if (k >= g.steps.length) return fin(g, {holds: holds.map(Math.round)}, holds.length ? holds.map((h, i) => `Задержка ${i + 1}: ${fmt(h)}`) : ['Сделано ' + fmt((performance.now() - start) / 1000)]);
      const s = g.steps[k++], t0 = performance.now(), head = `${warn}<h2>${esc(g.title)} · ${k} из ${g.steps.length}</h2>`;
      shell({back: false, title: '', body: s.hold
        ? `${head}<div class="center" id="tap"><h1>Выдох — держи</h1><div class="huge dim" id="big">0:00</div><p class="muted">${esc(s.say)}</p><p class="muted small">Коснись экрана, чтобы закончить</p></div>`
        : `${head}<p class="muted">${esc(s.say || '')}</p>${s.p ? PACER : `<div class="center"><div class="huge dim" id="big">${fmt(s.s)}</div></div>`}`,
        foot: `<button class="btn quiet" data-act="gend">Остановить</button>`});
      A.gend = () => run ? next() : go('games');
      if (s.hold) {
        speak('выдох, держи'); tone(392, .12, .5);
        let lc = 0;
        every(() => { const sec = (performance.now() - t0) / 1000, b = $('#big'); b && (b.textContent = fmt(sec)); if (Math.floor(sec / 30) > lc) { lc = Math.floor(sec / 30); speak(cueText(lc * 30)); } }, 200);
        $('.body').addEventListener('pointerdown', e => { if (e.target.closest('button')) return; const sec = (performance.now() - t0) / 1000; if (sec < 1) return; holds.push(sec); later(step, 0); });
        return;
      }
      if (s.say) speak(s.say);
      let last = '', done = false;
      loop(now => {
        const t = (now - t0) / 1000;
        if (t >= s.s) { if (!done) { done = true; later(step, 0); } return; }
        if (!s.p) { $('#big').textContent = fmt(Math.ceil(s.s - t)); return; }
        const l = pacerTick(s.p, t);
        if (l !== last) { last = l; if (!g.quiet && t > 2) tone({'Вдох': 440, 'Выдох': 330}[l] || 392, .1, .5); }
      });
    };
    const start = performance.now();
    step();
  },
  holdpair(g) {
    const warn = banner(g), times = [];
    const reset = () => { cleanups.forEach(f => f()); cleanups = []; try { speechSynthesis.cancel(); } catch (e) {} };
    const hold = i => {
      reset(); const t0 = performance.now();
      shell({back: false, title: g.title, body: `${warn}<div class="center"><h2>${i ? 'Вторая · расслабленная' : 'Первая · напряжённая'}</h2><div class="huge dim" id="big">0:00</div>
        <p class="muted">${i ? 'Плечи, лицо и живот мягкие. Обычный вдох, без усилия.' : 'Обычный вдох, плечи подняты и напряжены.'}</p><p class="muted small">Коснись экрана, чтобы закончить</p></div>`});
      every(() => { $('#big').textContent = fmt((performance.now() - t0) / 1000); }, 100);
      speak(i ? 'вдох, расслабься и держи' : 'вдох, напряги плечи и держи');
      $('.body').addEventListener('pointerdown', () => { times[i] = (performance.now() - t0) / 1000; i ? show() : calm(); }, {once: true});
    };
    const calm = () => {
      reset(); const t0 = performance.now(); let nextHold = false;
      shell({back: false, title: g.title, body: `${warn}<h2>Спокойное дыхание · вдох 5, выдох 7</h2>${PACER}`, foot: `<button class="btn quiet" data-act="gend">Остановить</button>`});
      A.gend = () => go('games');
      loop(now => { const t = (now - t0) / 1000; if (t < 120) return pacerTick('calm', t); if (!nextHold) { nextHold = true; later(() => hold(1), 0); } });
    };
    const show = () => {
      reset(); const [a, b] = times, d = b - a;
      fin(g, {h1: Math.round(a), h2: Math.round(b)}, [`Напряжённая: ${fmt(a)}`, `Расслабленная: ${fmt(b)}`, `Разница: ${d < 0 ? '−' : '+'}${fmt(Math.abs(d))}`, 'Это не рекорд. Сравни, как отличались ощущения.']);
    };
    hold(0);
  },
};
// Daily counter (Пять остановок): taps accumulate per calendar day in S.gd, each tap is logged.
function daily(g) {
  if (S.gd.d !== today()) S.gd = {d: today(), n: {}};
  const draw = () => {
    const n = S.gd.n[g.id] || 0;
    shell({back: 'games', title: g.title, body: `${banner(g)}<div class="center"><div class="huge">${n}</div><p class="muted">из ${g.goal} за сегодня</p><p class="muted small">${esc(g.text)}</p></div>`,
      foot: `<button class="btn primary" data-act="gtap">${g.btns[0]}</button>`});
    A.gtap = () => { S.gd.n[g.id] = n + 1; S.log.push({t: Date.now(), type: 'game', id: g.id, n: n + 1}); save(); draw(); };
  };
  draw();
}
SCREENS.games = () => shell({title: '', body: `<h1>Практики</h1>
  <p class="muted small">Играть можно недолго, но несколько раз в день. Время каждой практики меняется на её экране.</p>
  ${GROUP_ORDER.map(i => [GROUPS[i], i]).map(([n, i]) => `<h2>${n}</h2><div class="plan">${GAMES.filter(g => g.group === i).map(g => `<a class="item" href="#game?id=${g.id}"><span class="name">${esc(g.title)}</span><small>${meta(g)}</small></a>`).join('')}</div>`).join('')}`});
SCREENS.game = p => {
  const g = GAMES.find(x => x.id === p.get('id'));
  if (!g) return go('games');
  const timed = TIMED.includes(g.mech) && !g.daily;
  const draw = () => {
    shell({back: 'games', title: GROUPS[g.group], body: `<h1>${esc(g.title)}</h1>${banner(g)}<p class="muted">${esc(g.text)}</p>
      ${timed ? `<div class="plan"><div class="item"><span class="name">Время</span><span class="step"><button data-act="gstep" data-v="-1" aria-label="меньше">−</button><b>${dm(gmin(g))}</b><button data-act="gstep" data-v="1" aria-label="больше">+</button></span></div></div>` : ''}`,
      foot: g.mech === 'card' ? `<button class="btn primary" data-act="gback">К списку</button>` : `<button class="btn primary" data-act="gstart">${g.mech === 'link' ? 'Открыть' : 'Начать'}</button>`});
  };
  A.gstep = v => { const m = gmin(g), s = (v > 0 ? m : m - .01) < 3 ? .5 : 1; S.gmin[g.id] = Math.min(g.max || 30, Math.max(g.lo || .5, m + v * s)); save(); draw(); };
  A.gback = () => go('games');
  A.gstart = () => MECH[g.mech](g);
  draw();
  if (p.has('auto')) A.gstart();
};

/* ---- Заметка ---- */
SCREENS.note = p => {
  const done = p.has('done');
  shell({back: !done, title: 'Заметка', body: `<h1>Как прошло</h1><input type="text" id="nt" maxlength="140" placeholder="Одной строкой" autocomplete="off"><p class="muted small">Можно пустую. Заметка остаётся на этом устройстве.</p>`,
    foot: `<button class="btn primary" data-act="save">Сохранить</button>`});
  A.save = () => {
    S.notes.push({day: S.day, date: today(), text: $('#nt').value.trim() || '—'});
    if (!done) { save(); return go('today'); }
    const n = S.day; if (n >= 7) S.entryDone = true; S.day++; S.today.done = (S.today.done || 0) + 1; save();
    const nx = stageOf(S.day), nst = STAGES[nx.i];
    shell({back: false, title: '', body: `<div class="center"><h1>Тренировка ${n} пройдена</h1><p class="muted">Следующая: ${nst.name}, ${dayPlan(S.day).length} блоков, ${Math.round(dayPlan(S.day).reduce((a, id) => a + blockLen(id), 0) / 60)} мин.</p><p class="muted small">Можно сейчас, можно завтра.</p></div>`,
      foot: `<button class="btn primary" data-act="nextday">Следующая тренировка</button><button class="btn quiet" data-act="enough">На сегодня всё</button>`});
    A.nextday = () => { S.minimal = false; save(); run = {ids: plan(), i: 0}; pendingSay = 'Тренировка ' + S.day + '. ' + sayBlock(run.ids[0]); go(routeOf(run.ids[0])); };
    A.enough = () => go('today');
  };
};

route();
</script>
